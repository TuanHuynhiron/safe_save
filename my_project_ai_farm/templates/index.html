<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Chẩn Đoán Sức Khỏe Khu Vườn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .garden-card {
            transition: transform 0.2s ease, shadow 0.2s ease;
            cursor: pointer;
        }
        .garden-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-success display-5">🏡 Trạm Chẩn Đoán Bệnh Lá Cây</h1>
            <p class="lead text-muted">Vui lòng chọn khu vườn bạn muốn kiểm tra bệnh lá và huấn luyện AI</p>
        </div>

        <div class="row justify-content-center g-4">
            {% for key, crop in crops.items() %}
            <div class="col-md-5 col-lg-4">
                <div class="card h-100 shadow-sm border-0 garden-card text-center p-4">
                    <div class="display-1 mb-3">{{ crop.icon }}</div>
                    <h3 class="fw-bold mb-2">Khu Vườn {{ crop.name }}</h3>
                    <p class="text-muted small mb-4">Chẩn đoán các bệnh lý trên lá {{ crop.name | lower }} & quản lý dữ liệu huấn luyện riêng biệt.</p>
                    <a href="/plant/{{ key }}" class="btn btn-outline-success fw-bold rounded-pill mt-auto">Vào Khu Vườn</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
